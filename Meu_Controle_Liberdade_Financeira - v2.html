<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b3cc4">
<title>Meu Controle Financeiro</title>
<style>
:root{color-scheme:light;--bg:#f4f5fb;--card:#fff;--text:#24213b;--muted:#6d6982;--primary:#6548d3;--line:#e7e5ef;--green:#16834b;--red:#c5394b;--shadow:0 10px 30px #27204b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{background:linear-gradient(120deg,#375fca,#7c3fd0);color:#fff;padding:22px max(18px,calc((100% - 1100px)/2));}header h1{font-size:24px;margin:0}header p{margin:6px 0 0;opacity:.9}.wrap{max-width:1100px;margin:20px auto;padding:0 16px}.tabs{display:flex;gap:8px;overflow:auto;padding:2px 0 12px}.tabs button,.button{border:0;border-radius:12px;padding:10px 15px;background:#fff;color:var(--text);font:inherit;font-weight:650;cursor:pointer;white-space:nowrap;box-shadow:0 2px 8px #2221}.tabs button.active,.button.primary{background:var(--primary);color:white}.button.danger{color:var(--red)}button:hover{filter:brightness(.97)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 12px}.metric{font-size:25px;font-weight:750;margin-top:8px}.muted{color:var(--muted);font-size:13px}.good{color:var(--green)}.bad{color:var(--red)}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;align-items:end}label{display:block;color:var(--muted);font-size:13px}input,select{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:10px;background:white;color:var(--text);padding:10px;font:inherit}input:focus,select:focus{outline:2px solid #6548d344;border-color:var(--primary)}.actions{display:flex;align-items:end;gap:8px;flex-wrap:wrap}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:11px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:12px}td:last-child{text-align:right}.empty{padding:24px;text-align:center;color:var(--muted)}.status{position:fixed;bottom:12px;left:12px;padding:8px 12px;border-radius:20px;background:#fff;box-shadow:var(--shadow);font-size:12px;color:var(--green)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.toolbar input[type=file]{max-width:240px}.hint{background:#f0edff;padding:12px;border-radius:12px;color:#43377b;font-size:13px;line-height:1.5}.hidden{display:none!important}.progress{height:9px;background:var(--line);border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}@media(max-width:600px){header{padding:18px}.wrap{margin:12px auto}.metric{font-size:22px}.card{padding:15px}}
</style>
</head>
<body>
<header><h1>Meu Controle Financeiro</h1><p>Organize suas contas, acompanhe gastos e cuide dos seus objetivos.</p></header>
<div class="wrap">
<nav class="tabs" aria-label="Seções do app"><button data-tab="inicio" class="active">Visão geral</button><button data-tab="lancamentos">Lançamentos</button><button data-tab="contas">Contas e dívidas</button><button data-tab="objetivos">Objetivos</button><button data-tab="backup">Dados e backup</button></nav>
<main id="app" aria-live="polite"></main>
</div><div class="status" id="status">Salvo neste aparelho</div>
<script>
'use strict';
const STORAGE_KEY='meu-controle-financeiro-v1';
const today=()=>new Date().toISOString().slice(0,10);
const blank=()=>({transactions:[],accounts:[],goals:[]});
function load(){try{const value=JSON.parse(localStorage.getItem(STORAGE_KEY));if(value&&Array.isArray(value.transactions)&&Array.isArray(value.accounts)&&Array.isArray(value.goals))return value}catch(e){}return blank()}
let data=load(),tab='inicio';
const $=(s,root=document)=>root.querySelector(s);
const money=c=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format((Number(c)||0)/100);
const cents=s=>{const n=Number(String(s).trim().replace(/\./g,'').replace(',','.'));return Number.isFinite(n)&&n>=0?Math.round(n*100):null};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));$('#status').textContent='Salvo neste aparelho · '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#status').className='status'}catch(e){$('#status').textContent='Não foi possível salvar neste navegador';$('#status').className='status bad'}}
function total(items,filter=()=>true){return items.filter(filter).reduce((n,x)=>n+(Number(x.amount)||0),0)}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const root=$('#app');root.innerHTML=tab==='inicio'?home():tab==='lancamentos'?transactions():tab==='contas'?accounts():tab==='objetivos'?goals():backup();bind()}
function home(){const month=today().slice(0,7),ts=data.transactions.filter(x=>x.date?.slice(0,7)===month),income=total(ts,x=>x.type==='income'),expense=total(ts,x=>x.type==='expense'),remaining=income-expense,debt=total(data.accounts,x=>x.kind==='debt');return `<section class="grid"><div class="card"><div class="muted">Entradas neste mês</div><div class="metric good">${money(income)}</div></div><div class="card"><div class="muted">Saídas neste mês</div><div class="metric bad">${money(expense)}</div></div><div class="card"><div class="muted">Saldo do mês (com lançamentos)</div><div class="metric ${remaining<0?'bad':'good'}">${money(remaining)}</div></div><div class="card"><div class="muted">Dívidas cadastradas</div><div class="metric">${money(debt)}</div></div></section><section class="card"><h2>Últimos lançamentos</h2>${transactionTable(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}</section><p class="hint">Os dados são salvos automaticamente no armazenamento local deste navegador. Eles não são enviados para um servidor e não acompanham você para outros aparelhos. Faça backups periódicos em “Dados e backup”.</p>`}
function transactions(){return `<section class="card"><h2>Novo lançamento</h2><form id="tx-form"><label>Tipo<select name="type"><option value="expense">Despesa</option><option value="income">Receita</option></select></label><label>Descrição<input name="name" required maxlength="100" placeholder="Ex.: mercado"></label><label>Categoria<input name="category" maxlength="50" placeholder="Ex.: Alimentação"></label><label>Valor (R$)<input name="amount" required inputmode="decimal" placeholder="0,00"></label><label>Data<input name="date" type="date" value="${today()}" required></label><div class="actions"><button class="button primary">Adicionar lançamento</button></div></form></section><section class="card"><h2>Histórico</h2>${transactionTable(data.transactions.slice().sort((a,b)=>b.date.localeCompare(a.date)))}</section>`}
function transactionTable(items){if(!items.length)return '<div class="empty">Ainda não há lançamentos.</div>';return `<div class="tablewrap"><table><thead><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead><tbody>${items.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.name)}</td><td>${esc(x.category||'—')}</td><td>${x.type==='income'?'Receita':'Despesa'}</td><td class="${x.type==='income'?'good':'bad'}">${x.type==='income'?'+':'−'}${money(x.amount)}</td><td><button class="button danger" data-delete-tx="${esc(x.id)}" aria-label="Excluir ${esc(x.name)}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`}
function accounts(){return `<section class="card"><h2>Cadastrar conta ou dívida</h2><form id="account-form"><label>Tipo<select name="kind"><option value="debt">Dívida / parcela</option><option value="account">Conta / cartão</option></select></label><label>Nome<input name="name" required maxlength="100" placeholder="Ex.: cartão ou empréstimo"></label><label>Valor atual (R$)<input name="amount" required inputmode="decimal" placeholder="0,00"></label><label>Vencimento (opcional)<input name="due" type="date"></label><div class="actions"><button class="button primary">Adicionar</button></div></form></section><section class="card"><h2>Contas cadastradas</h2>${data.accounts.length?`<div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Nome</th><th>Valor</th><th>Vencimento</th><th></th></tr></thead><tbody>${data.accounts.map(x=>`<tr><td>${x.kind==='debt'?'Dívida':'Conta / cartão'}</td><td>${esc(x.name)}</td><td>${money(x.amount)}</td><td>${esc(x.due||'—')}</td><td><button class="button danger" data-delete-account="${esc(x.id)}">Excluir</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Nenhuma conta ou dívida cadastrada.</div>'}</section>`}
function goals(){return `<section class="card"><h2>Novo objetivo</h2><form id="goal-form"><label>Nome do objetivo<input name="name" required maxlength="100" placeholder="Ex.: reserva de emergência"></label><label>Meta (R$)<input name="target" required inputmode="decimal" placeholder="0,00"></label><label>Já guardado (R$)<input name="saved" inputmode="decimal" placeholder="0,00" value="0,00"></label><div class="actions"><button class="button primary">Salvar objetivo</button></div></form></section><section class="grid">${data.goals.length?data.goals.map(x=>{const pct=x.target?Math.min(100,Math.round(x.saved/x.target*100)):0;return `<article class="card"><h3>${esc(x.name)}</h3><p>${money(x.saved)} guardados de ${money(x.target)}</p><div class="progress"><i style="width:${pct}%"></i></div><p class="muted">${pct}% da meta</p><div class="actions"><button class="button" data-add-goal="${esc(x.id)}">Adicionar valor</button><button class="button danger" data-delete-goal="${esc(x.id)}">Excluir</button></div></article>`}).join(''):'<div class="card empty">Ainda não há objetivos cadastrados.</div>'}</section>`}
function backup(){return `<section class="card"><h2>Dados e backup</h2><p>O app grava automaticamente seus dados no armazenamento local deste navegador. Eles não são enviados para a internet. Para usá-los em outro aparelho, exporte o backup e importe-o nele.</p><div class="toolbar"><button class="button primary" id="export">Baixar backup JSON</button><label class="button">Importar backup JSON<input id="import" type="file" accept="application/json,.json" hidden></label><button class="button danger" id="clear">Apagar todos os dados deste aparelho</button></div><p class="muted">Apagar os dados do navegador ou usar uma janela anônima também pode remover ou isolar os dados salvos. Guarde um backup em local seguro.</p></section>`}
function bind(){const tx=$('#tx-form');if(tx)tx.onsubmit=e=>{e.preventDefault();const f=new FormData(tx),amount=cents(f.get('amount'));if(amount===null)return alert('Confira o valor informado.');data.transactions.push({id:crypto.randomUUID?.()||String(Date.now()),type:f.get('type'),name:String(f.get('name')).trim(),category:String(f.get('category')).trim(),amount,date:f.get('date')});persist();render()};const ac=$('#account-form');if(ac)ac.onsubmit=e=>{e.preventDefault();const f=new FormData(ac),amount=cents(f.get('amount'));if(amount===null)return alert('Confira o valor informado.');data.accounts.push({id:crypto.randomUUID?.()||String(Date.now()),kind:f.get('kind'),name:String(f.get('name')).trim(),amount,due:f.get('due')});persist();render()};const gf=$('#goal-form');if(gf)gf.onsubmit=e=>{e.preventDefault();const f=new FormData(gf),target=cents(f.get('target')),saved=cents(f.get('saved')||'0');if(target===null||saved===null)return alert('Confira os valores informados.');data.goals.push({id:crypto.randomUUID?.()||String(Date.now()),name:String(f.get('name')).trim(),target,saved});persist();render()};document.querySelectorAll('[data-delete-tx]').forEach(b=>b.onclick=()=>{data.transactions=data.transactions.filter(x=>x.id!==b.dataset.deleteTx);persist();render()});document.querySelectorAll('[data-delete-account]').forEach(b=>b.onclick=()=>{data.accounts=data.accounts.filter(x=>x.id!==b.dataset.deleteAccount);persist();render()});document.querySelectorAll('[data-delete-goal]').forEach(b=>b.onclick=()=>{data.goals=data.goals.filter(x=>x.id!==b.dataset.deleteGoal);persist();render()});document.querySelectorAll('[data-add-goal]').forEach(b=>b.onclick=()=>{const value=prompt('Quanto deseja adicionar? (R$)');if(value===null)return;const amount=cents(value);if(amount===null)return alert('Confira o valor.');const goal=data.goals.find(x=>x.id===b.dataset.addGoal);if(goal){goal.saved+=amount;persist();render()}});const ex=$('#export');if(ex)ex.onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='meu-controle-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)};const im=$('#import');if(im)im.onchange=async()=>{try{const x=JSON.parse(await im.files[0].text());if(!x||!Array.isArray(x.transactions)||!Array.isArray(x.accounts)||!Array.isArray(x.goals))throw Error();if(!confirm('Importar este backup substituirá os dados salvos neste navegador. Continuar?'))return;data=x;persist();render()}catch(e){alert('Arquivo inválido ou incompatível. Seus dados atuais não foram alterados.')}};const clear=$('#clear');if(clear)clear.onclick=()=>{if(confirm('Tem certeza? Isso apagará permanentemente os dados salvos neste navegador.')){data=blank();persist();render()}}}
document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY){data=load();render()}});
render();persist();
</script>
</body>
</html>
